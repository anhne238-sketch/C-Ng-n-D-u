<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vườn Cá Ngừ</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#ffd6ec;
    font-family:"Comic Sans MS", cursive;
    overflow:hidden;
}

h1{
    color:#ffffff;
    font-size:55px;
    text-align:center;
    text-shadow:3px 3px 8px #ff69b4;
    animation:float 2s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}
</style>

</head>
<body>

<h1>🌸 Chào Mừng Đến<br>Vườn Cá Ngừ 🌸</h1>

</body>
</html>
